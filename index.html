<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="description" content="Sketch and check a chip's architecture in your browser. Made for beginners.">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; base-uri 'none'; form-action 'none'">
  <title>ChipSketch</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div id="app">
    <header id="top" hidden></header>
    <div id="body">
      <main id="main"></main>
      <aside id="drawer" hidden aria-label="Details"></aside>
    </div>
  </div>
  <div id="popover" role="status" hidden></div>
  <div id="toast" role="status" hidden></div>
  <input id="file" type="file" accept=".json,application/json" hidden>

  <script src="js/knowledge.js"></script>
  <script src="js/model.js"></script>
  <script src="js/layout.js"></script>
  <script src="js/checks.js"></script>
  <script src="js/verilog.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
